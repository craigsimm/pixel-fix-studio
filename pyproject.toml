[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-fix-studio"
version = "1.0.2"
description = "Retro launcher front-end for Pixel-Fix Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pixel-fix contributors" }]
dependencies = ["Pillow>=10.0"]

[project.scripts]
pixel-fix-studio = "pixel_fix_studio.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixel_fix_studio = [
  "resources/fonts/*.ttf",
  "resources/icons/*.ico",
  "resources/icons/*.png",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
