[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-fix"
version = "0.1.0"
description = "Clean and recover editable pixel art from AI-generated pixel-art-like images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pixel-fix contributors" }]
dependencies = ["Pillow>=10.0", "numpy>=1.26"]

[project.scripts]
pixel-fix = "pixel_fix.cli:main"
pixel-fix-gui = "pixel_fix.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixel_fix = [
  "resources/assets/*.png",
  "resources/fonts/*.ttf",
  "resources/icons/*.ico",
  "resources/icons/*.png",
  "resources/palettes/**/*.gpl",
  "resources/palettes/*.gpl",
]

[project.optional-dependencies]
ai = ["openai>=1.40.0", "google-genai>=1.0.0"]
